<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oneironant: BrothersWake</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b12;
            /* outside area */
            overflow: hidden;
        }

        #screen {
            /* game aspect ratio */
            --gw: 1024;
            --gh: 768;

            /* ✅ fit to BOTH width + height (never overflow) */
            width: min(94vw, calc(94dvh * (var(--gw) / var(--gh))), 1500px);
            aspect-ratio: var(--gw) / var(--gh);

            padding: 16px;
            /* bezel thickness */
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* The actual game canvas */
        #gameWorld {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 18px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.20);
            outline: none;

            /* pixel-art friendly */
            image-rendering: pixelated;
        }
    </style>

    <script type="text/javascript" src="./assetmanager.js"></script>
    <script type="text/javascript" src="./timer.js"></script>
    <script type="text/javascript" src="./gameengine.js"></script>
    <script type="text/javascript" src="./util.js"></script>
    <script type="text/javascript" src="./animator.js"></script>
    <script type="text/javascript" src="./background.js"></script>
    <script type="text/javascript" src="./level.js"></script>
    <script type="text/javascript" src="./hero.js"></script>
    <script type="text/javascript" src="./hud.js"></script>
    <script type="text/javascript" src="./music.js"></script>
    <script type="text/javascript" src="./menu.js"></script>
    <script type="text/javascript" src="./ghost1.js"></script>
    <script type="text/javascript" src="./ghost2.js"></script>
    <script type="text/javascript" src="./ghost3.js"></script>
    <script type="text/javascript" src="./main.js"></script>
</head>

<body>
    <div id="screen">
        <canvas id="gameWorld" width="1024" height="768" tabindex="0"></canvas>
    </div>
</body>

</html>
